<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Traffic Monitor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<!-- ===================================================== -->
<!-- HEADER -->
<!-- ===================================================== -->
<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <span>TrafficAI</span>
  </div>

  <div class="header-right">
    <span id="video-label" class="video-label">No video</span>
    <div id="live-badge" class="badge badge-idle">● CONNECTING</div>
  </div>
</header>

<!-- ===================================================== -->
<!-- MAIN -->
<!-- ===================================================== -->
<main>

  <!-- =================================================== -->
  <!-- LEFT SIDE -->
  <!-- =================================================== -->
  <section class="video-panel">

    <!-- STREAM -->
    <div class="video-wrap">

      <img
        id="stream"
        crossorigin="anonymous"
        src="http://127.0.0.1:8000/stream/"
        alt="Live Stream"
        onload="onStreamLoad()"
        onerror="onStreamError()"
      />

      <div id="stream-overlay" class="stream-overlay">
        <div class="spinner"></div>
        <p>Connecting to stream…</p>
      </div>

    </div>

    <!-- UPLOAD -->
    <div
      id="drop-zone"
      class="drop-zone"
      ondragover="onDragOver(event)"
      ondragleave="onDragLeave(event)"
      ondrop="onDrop(event)"
      onclick="document.getElementById('file-input').click()">

      <input
        type="file"
        id="file-input"
        accept="video/*"
        style="display:none"
        onchange="uploadFile(this.files[0])"
      />

      <div class="drop-icon">🎬</div>

      <div class="drop-text">
        <strong>Drop any video here</strong>
        <span>or click to browse — mp4, avi, mkv, mov…</span>
      </div>

    </div>

    <!-- PROGRESS -->
    <div id="upload-progress" class="upload-progress hidden">

      <div class="progress-info">
        <span id="upload-filename">Uploading…</span>
        <span id="upload-pct">0%</span>
      </div>

      <div class="progress-track">
        <div id="progress-bar" class="progress-fill"></div>
      </div>

      <div id="upload-status" class="upload-status"></div>

    </div>

    <!-- SNAPSHOT -->
    <div id="snapshot-wrap" style="margin-top:12px;">
      <button
        id="snapshot-btn"
        class="snapshot-btn"
        onclick="takeSnapshot()"
      >
        Take Snapshot
      </button>
    </div>

    <!-- FOOTER -->
    <div class="video-footer">
      <span class="mono" id="frame-counter">Frame —</span>
      <span class="cam-label">Camera 1 · Live</span>
    </div>

  </section>

  <!-- =================================================== -->
  <!-- RIGHT SIDE -->
  <!-- =================================================== -->
  <aside class="stats-panel">

    <!-- ============================ -->
    <!-- LANE 1 -->
    <!-- ============================ -->
    <div class="stat-card accent-green" id="card-a">

      <div class="stat-icon">⬅️</div>

      <div class="stat-body">

        <div class="stat-label">Lane 1</div>

        <div
          class="stat-value"
          id="lane-a-count"
          style="margin-bottom:8px"
        >
          —
        </div>

        <div id="signal-a" class="signal-pill sig-yellow">
          Yellow
        </div>

        <div id="timer-a" class="lane-timer">
          0s
        </div>

      </div>

    </div>

    <!-- ============================ -->
    <!-- LANE 2 -->
    <!-- ============================ -->
    <div class="stat-card accent-blue" id="card-b">

      <div class="stat-icon">➡️</div>

      <div class="stat-body">

        <div class="stat-label">Lane 2</div>

        <div
          class="stat-value"
          id="lane-b-count"
          style="margin-bottom:8px"
        >
          —
        </div>

        <div id="signal-b" class="signal-pill sig-yellow">
          Yellow
        </div>

        <div id="timer-b" class="lane-timer">
          0s
        </div>

      </div>

    </div>

    <!-- ============================ -->
    <!-- TOTAL VEHICLES -->
    <!-- ============================ -->
    <div class="stat-card accent-amber">

      <div class="stat-icon">🆔</div>

      <div class="stat-body">

        <div class="stat-label">
          Total Unique Vehicles
        </div>

        <div class="stat-value" id="total-unique">
          —
        </div>

      </div>

      <div class="stat-bar-wrap">
        <div class="stat-bar" id="bar-unique"></div>
      </div>

    </div>

    <!-- ============================ -->
    <!-- CHART -->
    <!-- ============================ -->
    <!-- <div class="chart-card">

      <div class="chart-title">
        Vehicle Count History
      </div>

      <canvas
        id="chart"
        width="300"
        height="120"
      ></canvas>

    </div> -->

    <!-- STATUS -->
    <div
      id="status-bar"
      class="status-bar status-idle"
    >
      Waiting for stream…
    </div>

  </aside>

</main>

<script src="script.js"></script>

</body>
</html>
